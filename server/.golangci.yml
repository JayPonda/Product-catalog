version: "2"

run:
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
    rules:
      # Keep behavior aligned with golangci-lint v1.64.5 (v2's staticcheck
      # enables these quickfix analyzers that the old config did not enforce).
      - linters:
          - staticcheck
        text: '(ST1012|QF1008|QF1009|QF1012)'

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
