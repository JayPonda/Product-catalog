server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never advertise the nginx version.
    server_tokens off;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Enable once the site is served over HTTPS in production:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints hashed assets -> cache forever, immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML must never be cached so deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- Reverse proxy to the API (same-origin: no CORS, first-party cookies) ---
    location /api/ {
        proxy_pass http://api:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # SPA fallback: deep links like /products/123 resolve to index.html
    # instead of a 404 on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
